name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck, bc and jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck bc jq
      - name: Run the offline tests
        run: bash tests/run.sh
